name: Migrate exact hero asset

on:
  push:
    branches:
      - portfolio-2-production-test

permissions:
  contents: write

jobs:
  migrate-headshot:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: portfolio-2-production-test
      - name: Fetch and verify exact deployed headshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/media/profile
          curl --fail --location --retry 3 \
            "https://professional-portfolio-2-ruby.vercel.app/media/profile/mahir-gandhi-headshot.png" \
            --output public/media/profile/mahir-gandhi-headshot.png
          ACTUAL="$(git hash-object public/media/profile/mahir-gandhi-headshot.png)"
          EXPECTED="d25d3604f078d8e551c7bc16307dd9a0ba5e84d6"
          echo "expected=$EXPECTED"
          echo "actual=$ACTUAL"
          test "$ACTUAL" = "$EXPECTED"
      - name: Commit verified asset and remove migration workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/migrate-headshot.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/media/profile/mahir-gandhi-headshot.png .github/workflows/migrate-headshot.yml
          git commit -m "Restore exact portfolio hero asset"
          git push origin HEAD:portfolio-2-production-test
